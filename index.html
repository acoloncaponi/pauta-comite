<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pauta do Comitê de Crédito</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#0a0a0a;color:#fbfbfb;min-height:100vh}
#loading{position:fixed;inset:0;background:#0a0a0a;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;z-index:9999}
#loading p{font-size:14px;color:#888}
.spin{width:28px;height:28px;border:2px solid #222;border-top-color:#F16A69;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem;background:#0a0a0a}
.login-box{background:#111;border:1px solid #222;border-radius:16px;padding:2.5rem 2rem;width:100%;max-width:380px}
.login-logo{margin-bottom:2rem;display:flex;align-items:center;gap:10px}
.login-logo .c6-mark{font-size:28px;font-weight:800;letter-spacing:-1px;background:linear-gradient(90deg,#F16A69,#FFBD4C);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.login-logo .c6-bank{font-size:22px;font-weight:200;letter-spacing:4px;color:#fbfbfb}
.login-box h1{font-size:18px;font-weight:500;margin-bottom:4px;color:#fbfbfb}
.login-box p{font-size:13px;color:#666;margin-bottom:1.75rem}
.field{margin-bottom:1rem}
.field label{display:block;font-size:11px;color:#888;margin-bottom:6px;font-weight:500;text-transform:uppercase;letter-spacing:.05em}
.field input{width:100%;padding:10px 14px;border:1px solid #222;border-radius:8px;font-size:14px;background:#1a1a1a;color:#fbfbfb;font-family:inherit;transition:border-color .15s}
.field input:focus{outline:none;border-color:#F16A69}
#login-err{font-size:13px;color:#F16A69;background:rgba(241,106,105,.1);border:1px solid rgba(241,106,105,.2);padding:8px 12px;border-radius:8px;margin-bottom:1rem;display:none}
.btn-entrar{width:100%;padding:11px;background:linear-gradient(90deg,#F16A69,#FFBD4C);color:#000;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:opacity .15s}
.btn-entrar:hover{opacity:.9}
#app{display:none}
.topbar{background:#111;border-bottom:1px solid #1e1e1e;padding:0 1.5rem;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.topbar-l{display:flex;align-items:center;gap:14px}
.topbar-logo{font-size:18px;font-weight:800;letter-spacing:-0.5px;background:linear-gradient(90deg,#F16A69,#FFBD4C);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.topbar-divider{width:1px;height:20px;background:#2a2a2a}
.topbar-l h1{font-size:14px;font-weight:400;color:#aaa}
.topbar-r{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.live{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:500;color:#FFBD4C;background:rgba(255,189,76,.1);padding:3px 10px;border-radius:20px;border:1px solid rgba(255,189,76,.2)}
.live-dot{width:6px;height:6px;border-radius:50%;background:#FFBD4C;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.sync{font-size:12px;color:#555;display:flex;align-items:center;gap:4px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border:1px solid #2a2a2a;border-radius:8px;background:transparent;color:#aaa;font-size:13px;font-family:inherit;cursor:pointer;transition:all .12s}
.btn:hover{background:#1a1a1a;color:#fbfbfb;border-color:#333}
.btn-pri{background:linear-gradient(90deg,#F16A69,#FFBD4C);color:#000;border:none;font-weight:600}
.btn-pri:hover{opacity:.9}
.btn-suc{background:transparent;color:#FFBD4C;border-color:rgba(255,189,76,.3)}
.btn-suc:hover{background:rgba(255,189,76,.1);color:#FFBD4C}
.btn-dan{color:#F16A69;border-color:rgba(241,106,105,.3)}
.btn-dan:hover{background:rgba(241,106,105,.1)}
.btn-sm{padding:4px 8px;font-size:12px}
main{max-width:900px;margin:0 auto;padding:1.5rem 1rem 4rem}
.tabs{display:flex;border-bottom:1px solid #1e1e1e;margin-bottom:1.5rem}
.tab{padding:9px 18px;font-size:13px;cursor:pointer;color:#555;border-bottom:2px solid transparent;background:none;border-top:none;border-left:none;border-right:none;font-family:inherit;transition:all .15s}
.tab:hover{color:#aaa}
.tab.on{color:#fbfbfb;font-weight:500;border-bottom-color:#FFBD4C}
.date-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#111;border:1px solid #1e1e1e;border-radius:12px;padding:12px 16px;margin-bottom:1.25rem}
.date-bar label{font-size:13px;color:#666;white-space:nowrap}
.date-bar input[type=date]{padding:6px 10px;border:1px solid #2a2a2a;border-radius:8px;font-size:14px;font-weight:500;background:#1a1a1a;color:#fbfbfb;font-family:inherit;cursor:pointer;color-scheme:dark}
.date-bar input:focus{outline:none;border-color:#F16A69}
#date-label{font-size:14px;font-weight:500;flex:1}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-bottom:1.25rem}
.stat{background:#111;border-radius:8px;padding:12px 14px;border:1px solid #1e1e1e}
.stat .lb{font-size:12px;color:#555;margin-bottom:4px}
.stat .vl{font-size:24px;font-weight:600;color:#fbfbfb}
.form-box{background:#111;border:1px solid #1e1e1e;border-radius:12px;padding:1.25rem;margin-bottom:1.5rem}
.form-box h3{font-size:14px;font-weight:500;margin-bottom:12px;color:#fbfbfb}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:12px}
.fg{display:flex;flex-direction:column;gap:4px}
.fg label{font-size:11px;color:#666;font-weight:500;text-transform:uppercase;letter-spacing:.04em}
.fg input,.fg select{padding:8px 10px;border:1px solid #2a2a2a;border-radius:8px;font-size:13px;background:#1a1a1a;color:#fbfbfb;font-family:inherit}
.fg input:focus,.fg select:focus{outline:none;border-color:#F16A69}
.fg select option{background:#1a1a1a;color:#fbfbfb}
.alc-block{margin-bottom:2rem}
.alc-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid}
.alc-head .alc-name{font-size:15px;font-weight:600}
.alc-head .alc-ct{font-size:12px;color:#555;background:#1a1a1a;border:1px solid #2a2a2a;padding:2px 8px;border-radius:20px}
.h-a3{border-color:rgba(241,106,105,.4);color:#F16A69}
.h-a2{border-color:rgba(255,189,76,.4);color:#FFBD4C}
.h-a1{border-color:rgba(133,183,235,.4);color:#85b7eb}
.reg-sec{margin-bottom:10px}
.reg-head{display:flex;align-items:center;justify-content:space-between;padding:9px 14px;background:#161616;border:1px solid #1e1e1e;border-radius:8px;cursor:pointer;user-select:none;margin-bottom:5px;transition:background .1s}
.reg-head:hover{background:#1a1a1a}
.reg-head-l{display:flex;align-items:center;gap:8px}
.reg-name{font-size:13px;font-weight:500;color:#fbfbfb}
.reg-ct{font-size:12px;color:#555;background:#1a1a1a;border:1px solid #2a2a2a;padding:1px 7px;border-radius:20px}
.chevron{font-size:15px;transition:transform .2s;color:#555}
.chevron.rot{transform:rotate(-90deg)}
.items{display:flex;flex-direction:column;gap:5px}
.items.hide{display:none}
.item{display:flex;align-items:center;gap:8px;padding:9px 12px;background:#111;border:1px solid #1e1e1e;border-radius:8px;transition:background .1s}
.item:hover{background:#161616}
.item-num{font-size:13px;color:#333;width:22px;text-align:right;font-weight:600;flex-shrink:0}
.item-info{flex:1;min-width:0}
.item-name{font-size:14px;font-weight:500;color:#fbfbfb;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-meta{font-size:12px;color:#555;margin-top:1px}
.badge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;white-space:nowrap;flex-shrink:0}
.ba1{background:rgba(133,183,235,.15);color:#85b7eb;border:1px solid rgba(133,183,235,.2)}
.ba2{background:rgba(255,189,76,.15);color:#FFBD4C;border:1px solid rgba(255,189,76,.2)}
.ba3{background:rgba(241,106,105,.15);color:#F16A69;border:1px solid rgba(241,106,105,.2)}
.empty{padding:14px;text-align:center;font-size:13px;color:#333;border:1px dashed #1e1e1e;border-radius:8px}
.hist-list{display:flex;flex-direction:column;gap:10px}
.hcard{background:#111;border:1px solid #1e1e1e;border-radius:12px;overflow:hidden}
.hcard-h{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:#161616;cursor:pointer;transition:background .1s}
.hcard-h:hover{background:#1a1a1a}
.hcard-h .hd{font-size:14px;font-weight:500;color:#fbfbfb}
.hcard-h .hi{font-size:12px;color:#555;margin-top:2px}
.hcard-b{padding:12px 16px;display:none}
.hcard-b.open{display:block}
.h-alc{font-size:13px;font-weight:600;margin:10px 0 5px;padding-bottom:4px;border-bottom:1px solid #1e1e1e;color:#fbfbfb}
.h-reg{margin-bottom:8px}
.h-reg-name{font-size:11px;font-weight:500;color:#444;text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}
.h-item{font-size:13px;padding:3px 0;border-bottom:1px solid #1a1a1a;color:#ccc}
#toast-el{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#fbfbfb;color:#000;padding:10px 18px;border-radius:8px;font-size:13px;font-weight:500;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9999;white-space:nowrap}
#toast-el.show{opacity:1}
</style>
</head>
<body>

<div id="loading"><div class="spin"></div><p>Conectando...</p></div>

<div id="login-wrap">
  <div class="login-box">
    <div class="login-logo"><span class="c6-mark">C6</span><span class="c6-bank">BANK</span></div>
    <h1>Pauta do Comitê</h1>
    <p>Crédito Atacado · Corporate</p>
    <div id="login-err">Usuário ou senha incorretos.</div>
    <div class="field"><label>Usuário</label><input type="text" id="f-user" placeholder="admin" onkeydown="if(event.key==='Enter')doLogin()"></div>
    <div class="field"><label>Senha</label><input type="password" id="f-pass" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()"></div>
    <button class="btn-entrar" onclick="doLogin()">Entrar</button>
  </div>
</div>

<div id="app">
  <div class="topbar">
    <div class="topbar-l">
      <span class="topbar-logo">C6</span>
      <div class="topbar-divider"></div>
      <h1>Pauta do Comitê de Crédito</h1>
      <div class="sync" id="sync-el"><i class="ti ti-cloud-check" style="font-size:14px"></i>sincronizado</div>
    </div>
    <div class="topbar-r">
      <div class="live"><span class="live-dot"></span>ao vivo</div>
      <button class="btn" id="btn-copy" onclick="doCopy()"><i class="ti ti-clipboard"></i>Copiar</button>
      <button class="btn btn-suc" onclick="doExport()"><i class="ti ti-brand-whatsapp"></i>Exportar</button>
      <button class="btn btn-pri" onclick="doClose()"><i class="ti ti-device-floppy"></i>Fechar pauta</button>
      <button class="btn btn-sm" onclick="doLogout()"><i class="ti ti-logout"></i></button>
    </div>
  </div>
  <main>
    <div class="tabs">
      <button class="tab on" onclick="goTab('pauta',this)"><i class="ti ti-list" style="margin-right:5px;font-size:14px"></i>Pauta atual</button>
      <button class="tab" onclick="goTab('hist',this)"><i class="ti ti-history" style="margin-right:5px;font-size:14px"></i>Histórico</button>
    </div>
    <div id="tab-pauta">
      <div class="date-bar">
        <i class="ti ti-calendar-event" style="font-size:18px;color:#6b6b67"></i>
        <label>Data do comitê:</label>
        <input type="date" id="inp-date" onchange="onDateChange()">
        <div id="date-label" style="color:#a0a09c;font-size:13px">Nenhuma data selecionada</div>
      </div>
      <div class="stats" id="stats-el"></div>
      <div class="form-box">
        <h3><i class="ti ti-plus" style="font-size:14px;vertical-align:-1px;margin-right:4px"></i>Adicionar empresa à pauta</h3>
        <div class="form-grid">
          <div class="fg"><label>Nome da empresa</label><input type="text" id="inp-emp" placeholder="Ex: Empresa XYZ S.A." onkeydown="if(event.key==='Enter')doAdd()"></div>
          <div class="fg"><label>Analista responsável</label><input type="text" id="inp-ana" placeholder="Nome do analista" onkeydown="if(event.key==='Enter')doAdd()"></div>
          <div class="fg"><label>Alçada</label><select id="inp-alc"><option value="Alçada 3">Alçada 3</option><option value="Alçada 2">Alçada 2</option><option value="Alçada 1">Alçada 1</option></select></div>
          <div class="fg"><label>Regional</label><select id="inp-reg"></select></div>
        </div>
        <button class="btn btn-pri" onclick="doAdd()"><i class="ti ti-plus"></i>Adicionar à pauta</button>
      </div>
      <div id="pauta-el"></div>
    </div>
    <div id="tab-hist" style="display:none"><div id="hist-el"></div></div>
  </main>
</div>

<div id="toast-el"></div>

<script>
// ── CONFIG FIREBASE ──
firebase.initializeApp({
  apiKey:"AIzaSyBfrXjo1A3bel5GEEvsqOywsMQm_oDUPDA",
  authDomain:"pauta-comite.firebaseapp.com",
  databaseURL:"https://pauta-comite-default-rtdb.firebaseio.com",
  projectId:"pauta-comite",
  storageBucket:"pauta-comite.firebasestorage.app",
  messagingSenderId:"564652683131",
  appId:"1:564652683131:web:27906eaa85acbd4d3997de"
});
const DB = firebase.database();

// ── CONSTANTES ──
const REGS = ["Corporate","São Paulo Capital","São Paulo ABC","São Paulo Interior","Centro-Oeste","Nordeste","RJ - MG - ES","Sul"];
const ALCS = ["Alçada 3","Alçada 2","Alçada 1"];

// ── ESTADO ──
let pauta = {};
let hist = [];
let dataAtiva = '';
let dbListener = null;

REGS.forEach(r => pauta[r] = []);

// ── UTILS ──
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function toast(m){ const t=$('toast-el'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2500); }
function sync(m,ic){ $('sync-el').innerHTML='<i class="ti '+ic+'" style="font-size:14px"></i>'+m; }
function total(){ return REGS.reduce((s,r)=>s+(pauta[r]||[]).length,0); }
function totAlc(a){ return REGS.reduce((s,r)=>s+(pauta[r]||[]).filter(e=>e.alcada===a).length,0); }
function acls(a){ return a==='Alçada 1'?'ba1':a==='Alçada 2'?'ba2':'ba3'; }
function acls2(a){ return a==='Alçada 1'?'h-a1':a==='Alçada 2'?'h-a2':'h-a3'; }
function fmtDate(iso){ if(!iso)return''; const[y,m,d]=iso.split('-'); return d+'/'+m+'/'+y; }
function weekday(iso){
  if(!iso)return'';
  const[y,m,d]=iso.split('-').map(Number);
  return['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'][new Date(y,m-1,d).getDay()];
}
function diffDays(iso){
  if(!iso)return null;
  const[y,m,d]=iso.split('-').map(Number);
  const a=new Date(y,m-1,d),h=new Date(); h.setHours(0,0,0,0);
  return Math.round((a-h)/86400000);
}
function todayKey(){ return new Date().toISOString().split('T')[0]; }

// ── AUTH ──
function doLogin(){
  const u=$('f-user').value.trim().toLowerCase();
  const p=$('f-pass').value;
  if(u==='admin'&&p==='atacado'){
    sessionStorage.setItem('auth','1');
    $('login-wrap').style.display='none';
    $('app').style.display='block';
    $('login-err').style.display='none';
    startApp();
  } else {
    $('login-err').style.display='block';
  }
}
function doLogout(){ sessionStorage.removeItem('auth'); location.reload(); }

// ── FIREBASE ──
function fbSave(){
  if(!dataAtiva){ toast('⚠ Selecione a data primeiro'); return; }
  sync('salvando...','ti-cloud-upload');
  DB.ref('pautas/'+dataAtiva).set({
    regionais: pauta,
    dataComite: dataAtiva,
    ts: Date.now()
  })
  .then(()=>{ sync('sincronizado','ti-cloud-check'); })
  .catch(e=>{ sync('ERRO: '+e.code,'ti-cloud-x'); toast('Erro Firebase: '+e.message); console.error(e); });
}

function fbListen(key){
  // Remove listener anterior da referência guardada
  if(dbListener){ dbListener.ref.off('value', dbListener.fn); dbListener=null; }
  // Limpa pauta local antes de carregar nova data
  REGS.forEach(r=>pauta[r]=[]);
  render();
  if(!key){ return; }

  sync('carregando...','ti-refresh');
  const ref = DB.ref('pautas/'+key);
  const fn = ref.on('value',
    snap=>{
      const d = snap.val();
      if(d && d.regionais){
        REGS.forEach(r=>{ pauta[r] = Array.isArray(d.regionais[r]) ? d.regionais[r] : []; });
      } else {
        REGS.forEach(r=>{ pauta[r]=[]; });
      }
      sync('sincronizado','ti-cloud-check');
      render();
    },
    err=>{ sync('erro','ti-cloud-x'); toast('Erro ao carregar dados: '+err.message); }
  );
  dbListener = { ref, fn };
}

// ── DATA ──
function setDate(key){
  dataAtiva = key;
  if(key) localStorage.setItem('lastDate', key);
  $('inp-date').value = key || '';
  updateDateLabel();
  fbListen(key);
}

function onDateChange(){
  const key = $('inp-date').value;
  setDate(key);
}

function updateDateLabel(){
  const el = $('date-label');
  if(!dataAtiva){ el.innerHTML='<span style="color:#a0a09c;font-size:13px">Nenhuma data selecionada</span>'; return; }
  const diff = diffDays(dataAtiva);
  let badge='';
  if(diff===0) badge=' <span style="background:rgba(255,189,76,.15);color:#FFBD4C;font-size:11px;padding:2px 8px;border-radius:20px;font-weight:600">hoje</span>';
  else if(diff===1) badge=' <span style="background:rgba(255,189,76,.1);color:#FFBD4C;font-size:11px;padding:2px 8px;border-radius:20px;font-weight:600">amanhã</span>';
  else if(diff>1) badge=' <span style="background:rgba(255,189,76,.1);color:#FFBD4C;font-size:11px;padding:2px 8px;border-radius:20px;font-weight:600">em '+diff+' dias</span>';
  else badge=' <span style="background:rgba(241,106,105,.1);color:#F16A69;font-size:11px;padding:2px 8px;border-radius:20px;font-weight:600">há '+Math.abs(diff)+' dia(s)</span>';
  el.innerHTML='<strong>'+fmtDate(dataAtiva)+'</strong> — '+weekday(dataAtiva)+badge;
}

// ── RENDER ──
function renderStats(){
  $('stats-el').innerHTML=
    '<div class="stat"><div class="lb">Total de casos</div><div class="vl">'+total()+'</div></div>'+
    '<div class="stat"><div class="lb">Regionais ativas</div><div class="vl">'+REGS.filter(r=>(pauta[r]||[]).length>0).length+'</div></div>'+
    '<div class="stat"><div class="lb">Alçada 3</div><div class="vl">'+totAlc('Alçada 3')+'</div></div>'+
    '<div class="stat"><div class="lb">Alçada 2</div><div class="vl">'+totAlc('Alçada 2')+'</div></div>'+
    '<div class="stat"><div class="lb">Alçada 1</div><div class="vl">'+totAlc('Alçada 1')+'</div></div>';
}

function renderPauta(){
  const wrap=$('pauta-el'); if(!wrap)return;
  wrap.innerHTML='';
  ALCS.forEach(alc=>{
    const tA=totAlc(alc), cl=acls2(alc);
    const div=document.createElement('div'); div.className='alc-block';
    let inner='<div class="alc-head '+cl+'"><span class="alc-name">Comitê '+alc+'</span><span class="alc-ct">'+tA+' '+(tA===1?'caso':'casos')+'</span></div>';
    let num=1; let temItem=false;
    REGS.forEach(reg=>{
      const items=(pauta[reg]||[]).filter(e=>e.alcada===alc);
      if(!items.length)return; temItem=true;
      const bid='b'+alc.replace(/\s/g,'')+'_'+reg.replace(/[\s\/]+/g,'_');
      const cid='c'+alc.replace(/\s/g,'')+'_'+reg.replace(/[\s\/]+/g,'_');
      let rows=items.map((e,i)=>{
        const gi=(pauta[reg]||[]).indexOf(e);
        return '<div class="item">'+
          '<span class="item-num">'+(num+i)+'.</span>'+
          '<div class="item-info"><div class="item-name">'+esc(e.empresa)+'</div>'+
          '<div class="item-meta"><i class="ti ti-user" style="font-size:12px;vertical-align:-1px;margin-right:3px"></i>'+esc(e.analista)+'</div></div>'+
          '<span class="badge '+acls(alc)+'">'+esc(alc)+'</span>'+
          '<button class="btn btn-dan btn-sm" onclick="doRem(\''+reg.replace(/'/g,"\\'")+"',"+gi+')"><i class="ti ti-x"></i>Retirar</button></div>';
      }).join('');
      num+=items.length;
      inner+='<div class="reg-sec">'+
        '<div class="reg-head" onclick="togSec(\''+bid+'\',\''+cid+'\')">'+
        '<div class="reg-head-l"><span class="reg-name">'+reg+'</span><span class="reg-ct">'+items.length+' '+(items.length===1?'caso':'casos')+'</span></div>'+
        '<i class="ti ti-chevron-down chevron" id="'+cid+'"></i></div>'+
        '<div class="items" id="'+bid+'">'+rows+'</div></div>';
    });
    if(!temItem) inner+='<div class="empty">Nenhum caso nesta alçada</div>';
    div.innerHTML=inner; wrap.appendChild(div);
  });
}

function render(){ renderStats(); renderPauta(); }
function togSec(bid,cid){ $(bid).classList.toggle('hide'); $(cid).classList.toggle('rot'); }

// ── TABS ──
function goTab(t,el){
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on')); el.classList.add('on');
  $('tab-pauta').style.display=t==='pauta'?'':'none';
  $('tab-hist').style.display=t==='hist'?'':'none';
  if(t==='hist') renderHist();
}

// ── ADICIONAR / REMOVER ──
function doAdd(){
  const emp=$('inp-emp').value.trim();
  const ana=$('inp-ana').value.trim();
  const alc=$('inp-alc').value;
  const reg=$('inp-reg').value;
  if(!emp){toast('⚠ Informe o nome da empresa');return;}
  if(!ana){toast('⚠ Informe o analista responsável');return;}
  if(!dataAtiva){toast('⚠ Selecione a data do comitê primeiro');return;}
  pauta[reg].push({empresa:emp,analista:ana,alcada:alc,ts:Date.now()});
  $('inp-emp').value=''; $('inp-ana').value='';
  render();
  fbSave();
  toast('✓ '+emp+' adicionada');
}

function doRem(reg,idx){
  const nome=pauta[reg][idx].empresa;
  pauta[reg].splice(idx,1);
  render();
  fbSave();
  toast('Removido: '+nome);
}

// ── EXPORTAR ──
function buildText(){
  const dl=dataAtiva?fmtDate(dataAtiva)+' — '+weekday(dataAtiva):new Date().toLocaleDateString('pt-BR');
  let L=['*PAUTA DO COMITÊ DE CRÉDITO*','📅 '+dl,'📋 Total: '+total()+' caso(s)'];
  ALCS.forEach(alc=>{
    const tA=totAlc(alc); if(!tA)return;
    L.push('','*Comitê '+alc+'*'); let n=1;
    REGS.forEach(reg=>{
      const it=(pauta[reg]||[]).filter(e=>e.alcada===alc); if(!it.length)return;
      L.push('','_'+reg+'_'); it.forEach(e=>{L.push(n+'. '+e.empresa);n++;});
    });
  });
  return L.join('\n');
}

function doExport(){
  if(total()===0){toast('⚠ A pauta está vazia');return;}
  const blob=new Blob([buildText()],{type:'text/plain;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='pauta_'+(dataAtiva||'comite')+'.txt'; a.click();
  toast('✓ Arquivo gerado');
}

function doCopy(){
  if(total()===0){toast('⚠ A pauta está vazia');return;}
  const txt=buildText(), btn=$('btn-copy');
  navigator.clipboard.writeText(txt).then(()=>{
    btn.innerHTML='<i class="ti ti-clipboard-check"></i>Copiado!';
    toast('✓ Pauta copiada!');
    setTimeout(()=>{btn.innerHTML='<i class="ti ti-clipboard"></i>Copiar';},2500);
  }).catch(()=>{ const ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); toast('✓ Copiado!'); });
}

// ── FECHAR PAUTA ──
function doClose(){
  const tot=total(); if(tot===0){toast('⚠ A pauta está vazia');return;}
  const now=new Date();
  if(!Array.isArray(hist))hist=[];
  hist.unshift({id:Date.now(),dataComite:dataAtiva,dataCriacao:now.toLocaleDateString('pt-BR'),hora:now.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}),total:tot,regionais:JSON.parse(JSON.stringify(pauta))});
  if(dataAtiva) DB.ref('pautas/'+dataAtiva).remove();
  DB.ref('hist').set(hist);
  localStorage.removeItem('lastDate');
  REGS.forEach(r=>pauta[r]=[]);
  dataAtiva=''; $('inp-date').value=''; updateDateLabel(); render();
  toast('✓ Pauta fechada ('+tot+' casos)');
}

// ── HISTÓRICO ──
function renderHist(){
  const wrap=$('hist-el'); if(!wrap)return;
  if(!hist||!hist.length){wrap.innerHTML='<div class="empty" style="margin-top:1rem">Nenhuma pauta fechada ainda.</div>';return;}
  wrap.innerHTML='<div class="hist-list">'+hist.map((h,hi)=>{
    const dl=h.dataComite?fmtDate(h.dataComite)+' — '+weekday(h.dataComite):h.dataCriacao;
    const atv=REGS.filter(r=>(h.regionais[r]||[]).length>0);
    let bc='';
    ALCS.forEach(alc=>{
      const tA=REGS.reduce((s,r)=>s+(h.regionais[r]||[]).filter(e=>e.alcada===alc).length,0); if(!tA)return;
      bc+='<div class="h-alc">Comitê '+alc+'</div>'; let n=1;
      REGS.forEach(r=>{
        const it=(h.regionais[r]||[]).filter(e=>e.alcada===alc); if(!it.length)return;
        bc+='<div class="h-reg"><div class="h-reg-name">'+r+'</div>';
        it.forEach(e=>{bc+='<div class="h-item">'+n+'. '+esc(e.empresa)+' <span style="color:#6b6b67">— '+esc(e.analista)+'</span></div>';n++;});
        bc+='</div>';
      });
    });
    return '<div class="hcard"><div class="hcard-h" onclick="togH('+hi+')">'+
      '<div><div class="hd"><i class="ti ti-calendar-event" style="font-size:14px;vertical-align:-2px;margin-right:5px"></i>Comitê de '+dl+'</div>'+
      '<div class="hi">Salvo em '+h.dataCriacao+' às '+h.hora+' · '+h.total+' caso(s) · '+atv.length+' regional(is)</div></div>'+
      '<i class="ti ti-chevron-down" id="hi'+hi+'" style="font-size:16px;transition:transform .2s"></i></div>'+
      '<div class="hcard-b" id="hb'+hi+'">'+bc+
      '<div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">'+
      '<button class="btn btn-sm" onclick="copyH('+hi+')"><i class="ti ti-clipboard"></i>Copiar</button>'+
      '<button class="btn btn-suc btn-sm" onclick="expH('+hi+')"><i class="ti ti-brand-whatsapp"></i>Exportar</button>'+
      '<button class="btn btn-dan btn-sm" onclick="delH('+hi+')"><i class="ti ti-trash"></i>Excluir</button></div></div></div>';
  }).join('')+'</div>';
}

function togH(i){ const b=$('hb'+i),ic=$('hi'+i); const o=b.classList.toggle('open'); ic.style.transform=o?'rotate(180deg)':''; }

function expH(hi){
  const h=hist[hi];
  const dl=h.dataComite?fmtDate(h.dataComite)+' — '+weekday(h.dataComite):h.dataCriacao;
  let L=['*PAUTA DO COMITÊ DE CRÉDITO*','📅 '+dl,'📋 Total: '+h.total+' caso(s)'];
  ALCS.forEach(alc=>{
    const tA=REGS.reduce((s,r)=>s+(h.regionais[r]||[]).filter(e=>e.alcada===alc).length,0); if(!tA)return;
    L.push('','*Comitê '+alc+'*'); let n=1;
    REGS.forEach(r=>{
      const it=(h.regionais[r]||[]).filter(e=>e.alcada===alc); if(!it.length)return;
      L.push('','_'+r+'_'); it.forEach(e=>{L.push(n+'. '+e.empresa);n++;});
    });
  });
  const blob=new Blob([L.join('\n')],{type:'text/plain;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='pauta_'+(h.dataComite||h.dataCriacao).replace(/\//g,'-')+'.txt'; a.click();
  toast('✓ Exportado');
}

function copyH(hi){
  const h=hist[hi];
  const dl=h.dataComite?fmtDate(h.dataComite)+' — '+weekday(h.dataComite):h.dataCriacao;
  let L=['*PAUTA DO COMITÊ DE CRÉDITO*','📅 '+dl,'📋 Total: '+h.total+' caso(s)'];
  ALCS.forEach(alc=>{
    const tA=REGS.reduce((s,r)=>s+(h.regionais[r]||[]).filter(e=>e.alcada===alc).length,0); if(!tA)return;
    L.push('','*Comitê '+alc+'*'); let n=1;
    REGS.forEach(r=>{
      const it=(h.regionais[r]||[]).filter(e=>e.alcada===alc); if(!it.length)return;
      L.push('','_'+r+'_'); it.forEach(e=>{L.push(n+'. '+e.empresa);n++;});
    });
  });
  const txt=L.join('\n');
  navigator.clipboard.writeText(txt).then(()=>toast('✓ Pauta copiada!')).catch(()=>{
    const ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); toast('✓ Copiado!');
  });
}

function delH(i){
  hist.splice(i,1);
  DB.ref('hist').set(hist.length?hist:null);
  renderHist(); toast('Removido do histórico');
}

// ── INIT ──
function startApp(){
  // Popula select de regionais
  const sel=$('inp-reg');
  REGS.forEach(r=>{ const o=document.createElement('option'); o.value=r; o.textContent=r; sel.appendChild(o); });

  // Escuta histórico
  DB.ref('hist').on('value', snap=>{
    hist = snap.val() || [];
    if(!Array.isArray(hist)) hist=Object.values(hist);
    if($('tab-hist').style.display!=='none') renderHist();
  });

  // Carrega última data usada ou hoje
  const lastDate = localStorage.getItem('lastDate') || todayKey();
  setDate(lastDate);
}

// Inicia quando página carrega
window.addEventListener('load', ()=>{
  // Esconde loading após Firebase conectar
  // Esconde loading imediatamente — não bloqueia na conexão
  $('loading').style.display='none';
  
  DB.ref('.info/connected').on('value', snap=>{
    if(snap.val()===true){
      sync('sincronizado','ti-cloud-check');
    } else {
      sync('reconectando...','ti-cloud-x');
    }
  });

  // Se já estava logado, inicia app direto
  if(sessionStorage.getItem('auth')==='1'){
    $('login-wrap').style.display='none';
    $('app').style.display='block';
    startApp();
  }
});
</script>
